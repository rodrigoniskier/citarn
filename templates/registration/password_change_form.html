{% extends "base.html" %}
{% block title %}Alterar senha — CitaRN{% endblock %}
{% block content %}
<section class="page"><div class="shell"><div class="card form-card">
  <div class="form-section"><p class="eyebrow">Segurança</p><h1 class="page-title">Alterar senha</h1></div>
  <form method="post">{% csrf_token %}
    <div class="form-section">{{ form.as_p }}</div>
    <div class="form-actions"><a class="button button-secondary" href="{% url 'dashboard' %}">Cancelar</a><button class="button button-primary">Salvar nova senha</button></div>
  </form>
</div></div></section>
{% endblock %}
