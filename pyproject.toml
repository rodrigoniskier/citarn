[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["references/migrations", "staticfiles", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"references/forms.py" = ["B904"]
"references/services/extraction.py" = ["BLE001"]
